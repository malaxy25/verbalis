# Dependabot: suggests dependency updates as pull requests, grouped per ecosystem and month.
# The Tests workflow runs on every PR – merge only when it is green. Its job
# «build versions» installs exactly packaging/requirements-build.txt, so a pin that
# doesn't fit the others turns the PR red.
version: 2
updates:
  # pyproject.toml and packaging/requirements-build.txt (Dependabot finds both from the root;
  # a second entry for /packaging would only open the same PR twice)
  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    groups:
      python-dependencies:
        patterns: ["*"]
    ignore:
      # tokenizers (needed by faster-whisper) requires huggingface-hub < 2 (status October 2026).
      # Remove this once Dependabot proposes a tokenizers version that allows huggingface-hub 2.
      - dependency-name: "huggingface-hub"
        versions: [">=2"]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    groups:
      github-actions:
        patterns: ["*"]
