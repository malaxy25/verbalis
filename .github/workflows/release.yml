name: Release

# Builds Verbalis for Windows (installer) and macOS (app, experimental).
# - Version tag (v1.2.3): build both, self-test, publish ONE GitHub Release with the
#   matching CHANGELOG section. The tag must match verbalis.__version__.
#   A failing macOS build doesn't block the Windows release.
# - Manual run (Actions → Release → Run workflow): build and self-test only; the files
#   are attached to the run as artifacts, nothing is published.
#   Use it after merging dependency updates, before the next tag.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write   # needed to create the release

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.read.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - name: Read and check version
        id: read
        run: |
          set -euo pipefail
          version=$(python3 -c "import re; print(re.search(r'__version__ = \"(.+?)\"', open('src/verbalis/__init__.py').read()).group(1))")
          if [ "$GITHUB_REF_TYPE" = "tag" ] && [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "Tag $GITHUB_REF_NAME does not match verbalis.__version__ ($version)"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Version $version"

  windows:
    needs: version
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies (exact versions)
        run: |
          pip install -c packaging/requirements-build.txt -e ".[build]"
          if ($LASTEXITCODE -ne 0) { throw "pip install failed" }

      - name: Bundle with PyInstaller
        run: |
          pyinstaller packaging/verbalis.spec --noconfirm
          if ($LASTEXITCODE -ne 0) { throw "PyInstaller failed" }

      - name: Self-test of the bundle
        env:
          VERBALIS_HOME: ${{ runner.temp }}\verbalis-home
          MITSCHRIFT_HOME: ${{ runner.temp }}\no-old-home
        run: |
          dist\Verbalis\verbalis-cli.exe --version
          if ($LASTEXITCODE -ne 0) { throw "verbalis-cli --version failed" }
          dist\Verbalis\verbalis-cli.exe selftest
          if ($LASTEXITCODE -ne 0) { throw "self-test failed" }

      - name: Install Inno Setup
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            choco install innosetup --no-progress -y
            if ($LASTEXITCODE -ne 0) { throw "installing Inno Setup failed" }
          }
          if (-not (Test-Path $iscc)) { throw "ISCC.exe not found at $iscc" }
          "ISCC=$iscc" >> $env:GITHUB_ENV

      - name: Build installer
        run: |
          & $env:ISCC "/DAppVersion=${{ needs.version.outputs.version }}" packaging\verbalis.iss
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup failed" }
          Get-ChildItem dist\Verbalis-*-setup.exe | ForEach-Object { "{0}  {1:N0} MB" -f $_.Name, ($_.Length / 1MB) }

      - uses: actions/upload-artifact@v6
        with:
          name: Verbalis-${{ needs.version.outputs.version }}-windows
          path: dist/Verbalis-*-setup.exe
          if-no-files-found: error

  macos:
    # Experimental. System audio via the Swift helper (Core Audio tap, macOS 14.2+).
    needs: version
    runs-on: macos-latest      # Apple Silicon (arm64)
    continue-on-error: true    # must not block the Windows release
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies (exact versions)
        run: |
          set -euo pipefail
          pip install -c packaging/requirements-build.txt -e ".[build]"

      - name: Build the system audio helper (Swift)
        run: |
          set -euo pipefail
          mkdir -p tools/macos/build
          swiftc -O -swift-version 5 -target arm64-apple-macos14.2 \
            -o tools/macos/build/verbalis-audiotap tools/macos/audiotap.swift
          tools/macos/build/verbalis-audiotap --version

      - name: Bundle with PyInstaller
        run: |
          set -euo pipefail
          pyinstaller packaging/verbalis.spec --noconfirm
          test -x dist/Verbalis.app/Contents/MacOS/Verbalis
          test -x dist/Verbalis.app/Contents/MacOS/verbalis-cli

      - name: Self-test of the app bundle
        env:
          VERBALIS_HOME: ${{ runner.temp }}/verbalis-home
          MITSCHRIFT_HOME: ${{ runner.temp }}/no-old-home
        run: |
          set -euo pipefail
          dist/Verbalis.app/Contents/MacOS/verbalis-cli --version
          dist/Verbalis.app/Contents/MacOS/verbalis-cli selftest

      - name: Pack the app
        run: |
          set -euo pipefail
          # ditto keeps the bundle structure, symlinks and the (ad-hoc) code signature intact
          ditto -c -k --sequesterRsrc --keepParent dist/Verbalis.app \
            "dist/Verbalis-${{ needs.version.outputs.version }}-macos-arm64.zip"
          ls -lh dist/*.zip

      - uses: actions/upload-artifact@v6
        with:
          name: Verbalis-${{ needs.version.outputs.version }}-macos
          path: dist/Verbalis-*-macos-arm64.zip
          if-no-files-found: error

  publish:
    needs: [version, windows, macos]
    # publish whenever Windows succeeded – with or without the experimental Mac build
    if: always() && github.ref_type == 'tag' && needs.windows.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v4
        with:
          pattern: Verbalis-*
          path: dist
          merge-multiple: true

      - name: Release notes from CHANGELOG
        env:
          VERSION: ${{ needs.version.outputs.version }}
          MAC_RESULT: ${{ needs.macos.result }}
        run: |
          python3 - <<'PY'
          import os, re
          version = os.environ["VERSION"]
          lines = open("CHANGELOG.md", encoding="utf-8").read().splitlines()
          start = next((i for i, l in enumerate(lines) if re.match(rf"^## {re.escape(version)} ", l)), None)
          if start is None:
              raise SystemExit(f"CHANGELOG.md has no section for {version}")
          notes = []
          for line in lines[start + 1:]:
              if line.startswith("## "):
                  break
              notes.append(line)
          notes += ["", f"**Windows:** `Verbalis-{version}-setup.exe` herunterladen und ausführen. Ein Update "
                        "installiert man genauso – Einstellungen, Korrekturliste, Modelle und Aufnahmen bleiben erhalten."]
          if os.environ["MAC_RESULT"] == "success":
              notes += ["", f"**Mac (experimentell, Apple Silicon):** `Verbalis-{version}-macos-arm64.zip` entpacken und "
                            "Verbalis in «Programme» ziehen. Beim ersten Öffnen blockiert macOS die nicht signierte App: "
                            "Systemeinstellungen → Datenschutz & Sicherheit → «Trotzdem öffnen». Ab macOS 14.2 nimmt "
                            "Verbalis den Ton der anderen selbst auf (Berechtigung «Audioaufnahme» erlauben); "
                            "nur ältere Macs brauchen BlackHole, siehe README."]
          open("release-notes.md", "w", encoding="utf-8").write("\n".join(notes) + "\n")
          PY
          ls -l dist

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          name: Verbalis ${{ needs.version.outputs.version }}
          body_path: release-notes.md
          files: dist/*
          fail_on_unmatched_files: true
