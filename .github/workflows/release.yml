name: 2 · Build & Release
# Title in the run list: which tested commit is built
run-name: >-
  Build & Release: ${{ github.event.workflow_run.head_commit.message || format('manual build of {0}', github.ref_name) }}

# Builds Verbalis for Windows (installer) and macOS (app) and publishes it.
#
# Automatic: runs when the «Tests» workflow has finished for a push to main.
#   - Tests not all green           → nothing happens.
#   - version in src/verbalis/__init__.py already has a tag → nothing happens (no new version).
#   - new version                   → build exactly the tested commit, self-test, create the tag
#                                     v<version> and publish ONE GitHub Release with the matching
#                                     CHANGELOG section. A failing macOS build doesn't block Windows.
#   So a release = raise the version + CHANGELOG section + push. No manual tagging.
# Manual (Actions → Release → Run workflow): build and self-test only, files attached to the run,
#   nothing published. Use it after merging dependency updates.

on:
  workflow_run:
    workflows: ["1 · Tests"]   # must match the name in tests.yml exactly
    types: [completed]
  workflow_dispatch:

permissions:
  contents: write   # needed to create the release

jobs:
  version:
    # only after green tests of a push to main (or when started by hand)
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.read.outputs.version }}
      release: ${{ steps.read.outputs.release }}
      sha: ${{ steps.read.outputs.sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}   # exactly the tested commit
      - name: Read version, decide whether to release
        id: read
        env:
          EVENT: ${{ github.event_name }}
          SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          set -euo pipefail
          version=$(python3 -c "import re; print(re.search(r'__version__ = \"(.+?)\"', open('src/verbalis/__init__.py').read()).group(1))")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          if [ "$EVENT" != "workflow_run" ]; then
            echo "Manual run: build and self-test $version only"
            echo "release=false" >> "$GITHUB_OUTPUT"
          elif git ls-remote --exit-code --tags origin "refs/tags/v$version" >/dev/null; then
            echo "v$version is already released – nothing to do"
            echo "release=false" >> "$GITHUB_OUTPUT"
          else
            if ! grep -qE "^## ${version//./\\.} " CHANGELOG.md; then
              echo "::error::New version $version but CHANGELOG.md has no section «## $version – …»"
              exit 1
            fi
            echo "New version $version – building release"
            echo "release=true" >> "$GITHUB_OUTPUT"
          fi

  windows:
    needs: version
    if: needs.version.outputs.release == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.version.outputs.sha }}
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies (exact versions)
        run: |
          pip install -c packaging/requirements-build.txt -e ".[build]"
          if ($LASTEXITCODE -ne 0) { throw "pip install failed" }

      - name: Address for «Problem melden» (from secrets)
        env:
          VERBALIS_FEEDBACK_URL: ${{ secrets.VERBALIS_FEEDBACK_URL }}
          VERBALIS_FEEDBACK_TOKEN: ${{ secrets.VERBALIS_FEEDBACK_TOKEN }}
        run: |
          python tools/feedback/write_config.py
          if ($LASTEXITCODE -ne 0) { throw "feedback config failed" }

      - name: Bundle with PyInstaller
        run: |
          pyinstaller packaging/verbalis.spec --noconfirm
          if ($LASTEXITCODE -ne 0) { throw "PyInstaller failed" }

      - name: Self-test of the bundle
        env:
          VERBALIS_HOME: ${{ runner.temp }}\verbalis-home
          MITSCHRIFT_HOME: ${{ runner.temp }}\no-old-home
          VERBALIS_SELFTEST_DIARIZATION: "1"   # real models: both ONNX runtimes in one process
        run: |
          dist\Verbalis\verbalis-cli.exe --version
          if ($LASTEXITCODE -ne 0) { throw "verbalis-cli --version failed" }
          dist\Verbalis\verbalis-cli.exe selftest
          if ($LASTEXITCODE -ne 0) { throw "self-test failed" }

      - name: Install Inno Setup
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            choco install innosetup --no-progress -y
            if ($LASTEXITCODE -ne 0) { throw "installing Inno Setup failed" }
          }
          if (-not (Test-Path $iscc)) { throw "ISCC.exe not found at $iscc" }
          "ISCC=$iscc" >> $env:GITHUB_ENV

      - name: Build installer
        run: |
          & $env:ISCC "/DAppVersion=${{ needs.version.outputs.version }}" packaging\verbalis.iss
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup failed" }
          Get-ChildItem dist\Verbalis-*-setup.exe | ForEach-Object { "{0}  {1:N0} MB" -f $_.Name, ($_.Length / 1MB) }

      - uses: actions/upload-artifact@v6
        with:
          name: Verbalis-${{ needs.version.outputs.version }}-windows
          path: dist/Verbalis-*-setup.exe
          if-no-files-found: error

  macos:
    # System audio via the Swift helper (Core Audio tap, macOS 14.2+).
    needs: version
    if: needs.version.outputs.release == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: macos-latest      # Apple Silicon (arm64)
    continue-on-error: true    # must not block the Windows release
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.version.outputs.sha }}
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies (exact versions)
        run: |
          set -euo pipefail
          pip install -c packaging/requirements-build.txt -e ".[build]"

      - name: Build the system audio helper (Swift)
        run: |
          set -euo pipefail
          mkdir -p tools/macos/build
          swiftc -O -swift-version 5 -target arm64-apple-macos14.2 \
            -o tools/macos/build/verbalis-audiotap tools/macos/audiotap.swift
          tools/macos/build/verbalis-audiotap --version

      - name: Address for «Problem melden» (from secrets)
        env:
          VERBALIS_FEEDBACK_URL: ${{ secrets.VERBALIS_FEEDBACK_URL }}
          VERBALIS_FEEDBACK_TOKEN: ${{ secrets.VERBALIS_FEEDBACK_TOKEN }}
        run: python tools/feedback/write_config.py

      - name: Bundle with PyInstaller
        run: |
          set -euo pipefail
          pyinstaller packaging/verbalis.spec --noconfirm
          test -x dist/Verbalis.app/Contents/MacOS/Verbalis
          test -x dist/Verbalis.app/Contents/MacOS/verbalis-cli

      # macOS remembers the microphone and audio permissions per code signature. With an ad-hoc
      # signature every build is a «new app» and updates silently lost the permissions (no sound).
      # Signing every build with the same own certificate keeps them. Not notarized: Gatekeeper
      # still warns on the very first start (that needs a paid Apple developer account).
      - name: Sign with the Verbalis certificate
        env:
          CERT: ${{ secrets.MACOS_SIGNING_CERT }}
          PASSWORD: ${{ secrets.MACOS_SIGNING_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "$CERT" ]; then
            echo "::warning::Secret MACOS_SIGNING_CERT missing – the app keeps its ad-hoc signature"
            exit 0
          fi
          keychain="$RUNNER_TEMP/verbalis-signing.keychain-db"
          keychain_password=$(uuidgen)
          echo "$CERT" | base64 --decode > "$RUNNER_TEMP/verbalis-signing.p12"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 3600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$RUNNER_TEMP/verbalis-signing.p12" -k "$keychain" -P "$PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$keychain_password" "$keychain" >/dev/null
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          identity=$(security find-certificate -c "Verbalis Code Signing" -Z "$keychain" | awk '/SHA-1/ {print $3; exit}')
          test -n "$identity"
          # the helper first (PyInstaller puts it into Contents/Frameworks), then the whole bundle
          # (--deep signs the bundled libraries too)
          helper=$(find dist/Verbalis.app -name verbalis-audiotap -type f | head -1)
          test -n "$helper"
          echo "System audio helper: $helper"
          codesign --force --sign "$identity" --keychain "$keychain" --identifier ch.frehner.verbalis.audiotap "$helper"
          codesign --force --deep --sign "$identity" --keychain "$keychain" --identifier ch.frehner.verbalis \
            dist/Verbalis.app
          codesign --verify --deep --verbose=2 dist/Verbalis.app
          codesign --display --requirements - dist/Verbalis.app
          rm -f "$RUNNER_TEMP/verbalis-signing.p12"
          security delete-keychain "$keychain"

      - name: Self-test of the app bundle
        env:
          VERBALIS_HOME: ${{ runner.temp }}/verbalis-home
          MITSCHRIFT_HOME: ${{ runner.temp }}/no-old-home
          VERBALIS_SELFTEST_DIARIZATION: "1"
        run: |
          set -euo pipefail
          dist/Verbalis.app/Contents/MacOS/verbalis-cli --version
          dist/Verbalis.app/Contents/MacOS/verbalis-cli selftest

      - name: Pack the app
        run: |
          set -euo pipefail
          # ditto keeps the bundle structure, symlinks and the (ad-hoc) code signature intact
          ditto -c -k --sequesterRsrc --keepParent dist/Verbalis.app \
            "dist/Verbalis-${{ needs.version.outputs.version }}-macos-arm64.zip"
          ls -lh dist/*.zip

      # The installed app refuses an update that is not signed with the same certificate
      # (updates.check_same_signer). Check it here with the real codesign: the packed update must pass,
      # a re-signed copy must not.
      - name: Update signature check
        run: |
          set -euo pipefail
          check="$RUNNER_TEMP/update-check"
          rm -rf "$check" && mkdir -p "$check/ok" "$check/foreign"
          ditto -x -k "dist/Verbalis-${{ needs.version.outputs.version }}-macos-arm64.zip" "$check/ok"
          ditto "$check/ok/Verbalis.app" "$check/foreign/Verbalis.app"
          codesign --force --deep --sign - "$check/foreign/Verbalis.app"
          python - "$check" <<'PY'
          import sys
          from pathlib import Path
          from verbalis import updates
          check, running = Path(sys.argv[1]), Path("dist/Verbalis.app")
          updates.check_same_signer(check / "ok" / "Verbalis.app", running)
          try:
              updates.check_same_signer(check / "foreign" / "Verbalis.app", running)
          except RuntimeError as e:
              print("re-signed copy refused as expected:", e)
          else:
              raise SystemExit("a re-signed copy was accepted")
          print("update signature check ok")
          PY
          rm -rf "$check"

      # For the first install: a disk image with Verbalis and a link to «Programme». The ZIP stays for
      # the automatic updates. Users without administrator rights just open Verbalis from the image –
      # it then offers to move itself into their personal «Programme» folder.
      - name: Disk image for the first install
        run: |
          set -euo pipefail
          staging="$RUNNER_TEMP/dmg"
          mkdir -p "$staging"
          ditto dist/Verbalis.app "$staging/Verbalis.app"
          ln -s /Applications "$staging/Programme"
          hdiutil create -volname "Verbalis" -srcfolder "$staging" -ov -format UDZO \
            "dist/Verbalis-${{ needs.version.outputs.version }}-macos-arm64.dmg"
          ls -lh dist/*.dmg

      - uses: actions/upload-artifact@v6
        with:
          name: Verbalis-${{ needs.version.outputs.version }}-macos
          path: |
            dist/Verbalis-*-macos-arm64.zip
            dist/Verbalis-*-macos-arm64.dmg
          if-no-files-found: error

  publish:
    needs: [version, windows, macos]
    # publish whenever Windows succeeded – with or without the Mac build (a failed Mac build is fixed in the next version)
    if: always() && needs.version.outputs.release == 'true' && needs.windows.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.version.outputs.sha }}

      - uses: actions/download-artifact@v4
        with:
          pattern: Verbalis-*
          path: dist
          merge-multiple: true

      - name: Release notes from CHANGELOG
        env:
          VERSION: ${{ needs.version.outputs.version }}
          MAC_RESULT: ${{ needs.macos.result }}
        run: |
          python3 - <<'PY'
          import os, re
          version = os.environ["VERSION"]
          lines = open("CHANGELOG.md", encoding="utf-8").read().splitlines()
          start = next((i for i, l in enumerate(lines) if re.match(rf"^## {re.escape(version)} ", l)), None)
          if start is None:
              raise SystemExit(f"CHANGELOG.md has no section for {version}")
          notes = []
          for line in lines[start + 1:]:
              if line.startswith("## "):
                  break
              notes.append(line)
          notes += ["", f"**Windows:** download and run `Verbalis-{version}-setup.exe`. An update is installed the "
                        "same way – settings, correction list, models and recordings are kept."]
          if os.environ["MAC_RESULT"] == "success":
              notes += ["", f"**Mac (Apple Silicon):** open `Verbalis-{version}-macos-arm64.dmg` and drag "
                            "Verbalis onto «Programme» (Applications) – or just open Verbalis: it offers to move itself "
                            "there (into the personal Applications folder without an administrator account). "
                            "The ZIP is for the automatic updates. "
                            "On the first start macOS blocks the app because it is not notarized yet: close the message, then "
                            "System Settings → Privacy & Security → «Open Anyway» (once; updates keep it). From macOS 14.2 Verbalis records the "
                            "others' audio itself (allow the «Audio Recording» permission); "
                            "only older Macs need BlackHole, see the README."]
          open("release-notes.md", "w", encoding="utf-8").write("\n".join(notes) + "\n")
          PY
          ls -l dist

      - name: Create the version tag on the tested commit
        env:
          VERSION: ${{ needs.version.outputs.version }}
          SHA: ${{ needs.version.outputs.sha }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "v$VERSION" "$SHA" -m "Version $VERSION"
          git push origin "v$VERSION"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ needs.version.outputs.version }}
          name: Verbalis ${{ needs.version.outputs.version }}
          body_path: release-notes.md
          files: dist/*
          fail_on_unmatched_files: true
