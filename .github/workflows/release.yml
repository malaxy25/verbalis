name: 2 · Build & Release
# Title in the run list: which tested commit is built
run-name: >-
  Build & Release: ${{ github.event.workflow_run.head_commit.message || format('manual build of {0}', github.ref_name) }}

# Builds Verbalis for Windows (installer) and macOS (app) and publishes it.
#
# Automatic: runs when the «Tests» workflow has finished for a push to main.
#   - Tests not all green           → nothing happens.
#   - version in src/verbalis/__init__.py already has a tag → nothing happens (no new version).
#   - new version                   → build exactly the tested commit, self-test, create the tag
#                                     v<version> and publish ONE GitHub Release with the matching
#                                     CHANGELOG section. A failing macOS build doesn't block Windows.
#   So a release = raise the version + CHANGELOG section + push. No manual tagging.
# Manual (Actions → Release → Run workflow): build and self-test only, files attached to the run,
#   nothing published. Use it after merging dependency updates.

on:
  workflow_run:
    workflows: ["1 · Tests"]   # must match the name in tests.yml exactly
    types: [completed]
  workflow_dispatch:

# One release run at a time: two pushes a few seconds apart (version bump, then a backlog commit) both saw
# «no tag v0.7.50 yet», both built, and the second failed at «Create the version tag» (27 Nov 2026). Queued, the
# second run starts after the first has tagged and finds «already released – nothing to do».
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write   # needed to create the release
  actions: read     # SignPath reads the build and downloads the unsigned installer

# Code signing (docs/CODE-SIGNING.md) switches itself on when its secrets exist – without them the
# release is built exactly as before (Mac: own certificate, Windows: unsigned).
#   Mac, Developer ID + notarization: secrets MACOS_DEVID_CERT, MACOS_DEVID_PASSWORD, APPLE_API_KEY,
#     APPLE_API_KEY_ID, APPLE_API_ISSUER.
#   Windows, SignPath: secret SIGNPATH_API_TOKEN, variable SIGNPATH_ORGANIZATION_ID (optional variables
#     SIGNPATH_PROJECT_SLUG, SIGNPATH_SIGNING_POLICY_SLUG). Only for real releases, not manual builds.

jobs:
  version:
    # only after green tests of a push to main (or when started by hand)
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.read.outputs.version }}
      release: ${{ steps.read.outputs.release }}
      sha: ${{ steps.read.outputs.sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}   # exactly the tested commit
      - name: Read version, decide whether to release
        id: read
        env:
          EVENT: ${{ github.event_name }}
          SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          set -euo pipefail
          version=$(python3 -c "import re; print(re.search(r'__version__ = \"(.+?)\"', open('src/verbalis/__init__.py').read()).group(1))")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          if [ "$EVENT" != "workflow_run" ]; then
            echo "Manual run: build and self-test $version only"
            echo "release=false" >> "$GITHUB_OUTPUT"
          elif git ls-remote --exit-code --tags origin "refs/tags/v$version" >/dev/null; then
            echo "v$version is already released – nothing to do"
            echo "release=false" >> "$GITHUB_OUTPUT"
          else
            if ! grep -qE "^## ${version//./\\.} " CHANGELOG.md; then
              echo "::error::New version $version but CHANGELOG.md has no section «## $version – …»"
              exit 1
            fi
            echo "New version $version – building release"
            echo "release=true" >> "$GITHUB_OUTPUT"
          fi

  windows:
    needs: version
    if: needs.version.outputs.release == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.version.outputs.sha }}
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies (exact versions)
        run: |
          pip install -c packaging/requirements-build.txt -e ".[build]"
          if ($LASTEXITCODE -ne 0) { throw "pip install failed" }

      - name: Address for «Problem melden» (from secrets)
        env:
          VERBALIS_FEEDBACK_URL: ${{ secrets.VERBALIS_FEEDBACK_URL }}
          VERBALIS_FEEDBACK_TOKEN: ${{ secrets.VERBALIS_FEEDBACK_TOKEN }}
        run: |
          python tools/feedback/write_config.py
          if ($LASTEXITCODE -ne 0) { throw "feedback config failed" }

      - name: Bundle with PyInstaller
        run: |
          pyinstaller packaging/verbalis.spec --noconfirm
          if ($LASTEXITCODE -ne 0) { throw "PyInstaller failed" }

      - name: Self-test of the bundle
        env:
          VERBALIS_HOME: ${{ runner.temp }}\verbalis-home
          MITSCHRIFT_HOME: ${{ runner.temp }}\no-old-home
          VERBALIS_SELFTEST_DIARIZATION: "1"   # real models: both ONNX runtimes in one process
        run: |
          dist\Verbalis\verbalis-cli.exe --version
          if ($LASTEXITCODE -ne 0) { throw "verbalis-cli --version failed" }
          dist\Verbalis\verbalis-cli.exe selftest
          if ($LASTEXITCODE -ne 0) { throw "self-test failed" }

      - name: Install Inno Setup
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            choco install innosetup --no-progress -y
            if ($LASTEXITCODE -ne 0) { throw "installing Inno Setup failed" }
          }
          if (-not (Test-Path $iscc)) { throw "ISCC.exe not found at $iscc" }
          "ISCC=$iscc" >> $env:GITHUB_ENV

      - name: Build installer
        run: |
          & $env:ISCC "/DAppVersion=${{ needs.version.outputs.version }}" packaging\verbalis.iss
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup failed" }
          Get-ChildItem dist\Verbalis-*-setup.exe | ForEach-Object { "{0}  {1:N0} MB" -f $_.Name, ($_.Length / 1MB) }

      # SignPath Foundation signs the installer (free for open source). Every signing request waits for
      # Andrea's approval on signpath.io – the job waits too (up to 5 hours).
      - name: Code signing configured?
        id: signpath
        env:
          TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
          ORG: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          RELEASE: ${{ needs.version.outputs.release }}
        run: |
          $on = [bool]$env:TOKEN -and [bool]$env:ORG -and $env:RELEASE -eq "true"
          if (-not $on) { "SignPath not configured or not a release – the installer stays unsigned" }
          "enabled=$($on.ToString().ToLower())" >> $env:GITHUB_OUTPUT

      - name: Upload the unsigned installer for SignPath
        id: unsigned
        if: steps.signpath.outputs.enabled == 'true'
        uses: actions/upload-artifact@v6
        with:
          name: unsigned-windows-installer   # must not match «Verbalis-*» (publish takes those)
          path: dist/Verbalis-*-setup.exe
          if-no-files-found: error
          retention-days: 1

      - name: Sign with SignPath (waits for the approval)
        if: steps.signpath.outputs.enabled == 'true'
        uses: signpath/github-action-submit-signing-request@v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG || 'verbalis' }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG || 'release-signing' }}
          github-artifact-id: ${{ steps.unsigned.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 18000
          output-artifact-directory: dist/signed

      - name: Use the signed installer
        if: steps.signpath.outputs.enabled == 'true'
        run: |
          $signed = Get-ChildItem dist\signed -Recurse -Filter "Verbalis-*-setup.exe" | Select-Object -First 1
          if (-not $signed) { throw "SignPath returned no installer" }
          $sig = Get-AuthenticodeSignature -LiteralPath $signed.FullName
          $product = (Get-Item -LiteralPath $signed.FullName).VersionInfo.ProductName
          "Signature: $($sig.Status) – $($sig.SignerCertificate.Subject) – product $product"
          if ($sig.Status -ne "Valid") { throw "signature not valid: $($sig.Status)" }
          if ($product -ne "Verbalis") { throw "unexpected product name: $product" }
          Copy-Item -LiteralPath $signed.FullName -Destination "dist\$($signed.Name)" -Force
          Remove-Item -Recurse -Force dist\signed

      - uses: actions/upload-artifact@v6
        with:
          name: Verbalis-${{ needs.version.outputs.version }}-windows
          path: dist/Verbalis-*-setup.exe
          if-no-files-found: error

  macos:
    # System audio via the Swift helper (Core Audio tap, macOS 14.2+).
    needs: version
    if: needs.version.outputs.release == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: macos-latest      # Apple Silicon (arm64)
    continue-on-error: true    # must not block the Windows release
    outputs:
      notarized: ${{ steps.notarize.outputs.notarized }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.version.outputs.sha }}
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies (exact versions)
        run: |
          set -euo pipefail
          pip install -c packaging/requirements-build.txt -e ".[build]"

      - name: Build the system audio helper (Swift)
        run: |
          set -euo pipefail
          mkdir -p tools/macos/build
          swiftc -O -swift-version 5 -target arm64-apple-macos14.2 \
            -o tools/macos/build/verbalis-audiotap tools/macos/audiotap.swift
          tools/macos/build/verbalis-audiotap --version

      - name: Address for «Problem melden» (from secrets)
        env:
          VERBALIS_FEEDBACK_URL: ${{ secrets.VERBALIS_FEEDBACK_URL }}
          VERBALIS_FEEDBACK_TOKEN: ${{ secrets.VERBALIS_FEEDBACK_TOKEN }}
        run: python tools/feedback/write_config.py

      - name: Bundle with PyInstaller
        run: |
          set -euo pipefail
          pyinstaller packaging/verbalis.spec --noconfirm
          test -x dist/Verbalis.app/Contents/MacOS/Verbalis
          test -x dist/Verbalis.app/Contents/MacOS/verbalis-cli

      # macOS remembers the microphone and audio permissions per code signature. With an ad-hoc
      # signature every build is a «new app» and updates silently lost the permissions (no sound).
      # Signing every build with the same own certificate keeps them. Not notarized: Gatekeeper
      # still warns on the very first start (that needs a paid Apple developer account).
      - name: Sign with the Verbalis certificate
        env:
          CERT: ${{ secrets.MACOS_SIGNING_CERT }}
          PASSWORD: ${{ secrets.MACOS_SIGNING_PASSWORD }}
          DEVID_CERT: ${{ secrets.MACOS_DEVID_CERT }}
        run: |
          set -euo pipefail
          if [ -n "$DEVID_CERT" ]; then
            echo "Developer ID configured – signed in the next step instead"
            exit 0
          fi
          if [ -z "$CERT" ]; then
            echo "::warning::Secret MACOS_SIGNING_CERT missing – the app keeps its ad-hoc signature"
            exit 0
          fi
          keychain="$RUNNER_TEMP/verbalis-signing.keychain-db"
          keychain_password=$(uuidgen)
          echo "$CERT" | base64 --decode > "$RUNNER_TEMP/verbalis-signing.p12"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 3600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$RUNNER_TEMP/verbalis-signing.p12" -k "$keychain" -P "$PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$keychain_password" "$keychain" >/dev/null
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          identity=$(security find-certificate -c "Verbalis Code Signing" -Z "$keychain" | awk '/SHA-1/ {print $3; exit}')
          test -n "$identity"
          # the helper first (PyInstaller puts it into Contents/Frameworks), then the whole bundle
          # (--deep signs the bundled libraries too)
          helper=$(find dist/Verbalis.app -name verbalis-audiotap -type f | head -1)
          test -n "$helper"
          echo "System audio helper: $helper"
          codesign --force --sign "$identity" --keychain "$keychain" --identifier ch.frehner.verbalis.audiotap "$helper"
          codesign --force --deep --sign "$identity" --keychain "$keychain" --identifier ch.frehner.verbalis \
            dist/Verbalis.app
          codesign --verify --deep --verbose=2 dist/Verbalis.app
          codesign --display --requirements - dist/Verbalis.app
          rm -f "$RUNNER_TEMP/verbalis-signing.p12"
          security delete-keychain "$keychain"

      # Developer ID (paid Apple account): hardened runtime, every binary signed on its own, then
      # notarized after the self-test. The Team ID must already be in updates.APPLE_TEAM_ID of a released
      # version, or installed apps (own certificate) would refuse this update – see docs/CODE-SIGNING.md.
      - name: Sign with Developer ID
        id: devid
        env:
          CERT: ${{ secrets.MACOS_DEVID_CERT }}
          PASSWORD: ${{ secrets.MACOS_DEVID_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "$CERT" ]; then
            echo "Secret MACOS_DEVID_CERT missing – not notarized (own certificate)"
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          keychain="$RUNNER_TEMP/verbalis-devid.keychain-db"
          keychain_password=$(uuidgen)
          echo "$CERT" | base64 --decode > "$RUNNER_TEMP/verbalis-devid.p12"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 3600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$RUNNER_TEMP/verbalis-devid.p12" -k "$keychain" -P "$PASSWORD" -T /usr/bin/codesign
          rm -f "$RUNNER_TEMP/verbalis-devid.p12"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$keychain_password" "$keychain" >/dev/null
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          line=$(security find-identity -v -p codesigning "$keychain" | grep "Developer ID Application" | head -1)
          identity=$(echo "$line" | awk '{print $2}')
          team=$(echo "$line" | sed -E 's/.*\(([A-Z0-9]{10})\)".*/\1/')
          test -n "$identity"
          echo "Identity: $line"
          shipped=$(python3 -c "from verbalis import updates; print(updates.APPLE_TEAM_ID)")
          if [ "$team" != "$shipped" ]; then
            echo "::error::Certificate team $team is not updates.APPLE_TEAM_ID ($shipped). Release the Team ID first (docs/CODE-SIGNING.md)."
            exit 1
          fi
          bash tools/macos/sign_developer_id.sh dist/Verbalis.app "$identity" "$keychain"
          echo "enabled=true" >> "$GITHUB_OUTPUT"
          echo "SIGN_KEYCHAIN=$keychain" >> "$GITHUB_ENV"
          echo "SIGN_IDENTITY=$identity" >> "$GITHUB_ENV"

      - name: Self-test of the app bundle
        env:
          VERBALIS_HOME: ${{ runner.temp }}/verbalis-home
          MITSCHRIFT_HOME: ${{ runner.temp }}/no-old-home
          VERBALIS_SELFTEST_DIARIZATION: "1"
        run: |
          set -euo pipefail
          dist/Verbalis.app/Contents/MacOS/verbalis-cli --version
          dist/Verbalis.app/Contents/MacOS/verbalis-cli selftest

      - name: Notarize the app
        id: notarize
        if: steps.devid.outputs.enabled == 'true'
        env:
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          set -euo pipefail
          if [ -z "$APPLE_API_KEY" ] || [ -z "$APPLE_API_KEY_ID" ] || [ -z "$APPLE_API_ISSUER" ]; then
            echo "::error::Developer ID is set but the App Store Connect API key (APPLE_API_KEY, _KEY_ID, _ISSUER) is missing"
            exit 1
          fi
          printf '%s\n' "$APPLE_API_KEY" > "$RUNNER_TEMP/AuthKey.p8"
          echo "APPLE_API_KEY_FILE=$RUNNER_TEMP/AuthKey.p8" >> "$GITHUB_ENV"
          APPLE_API_KEY_FILE="$RUNNER_TEMP/AuthKey.p8" bash tools/macos/notarize.sh dist/Verbalis.app
          echo "notarized=true" >> "$GITHUB_OUTPUT"

      - name: Pack the app
        run: |
          set -euo pipefail
          # ditto keeps the bundle structure, symlinks and the (ad-hoc) code signature intact
          ditto -c -k --sequesterRsrc --keepParent dist/Verbalis.app \
            "dist/Verbalis-${{ needs.version.outputs.version }}-macos-arm64.zip"
          ls -lh dist/*.zip

      # The installed app refuses an update that is not signed with the same certificate
      # (updates.check_same_signer). Check it here with the real codesign: the packed update must pass,
      # a re-signed copy must not.
      - name: Update signature check
        run: |
          set -euo pipefail
          check="$RUNNER_TEMP/update-check"
          rm -rf "$check" && mkdir -p "$check/ok" "$check/foreign"
          ditto -x -k "dist/Verbalis-${{ needs.version.outputs.version }}-macos-arm64.zip" "$check/ok"
          ditto "$check/ok/Verbalis.app" "$check/foreign/Verbalis.app"
          codesign --force --deep --sign - "$check/foreign/Verbalis.app"
          python - "$check" <<'PY'
          import sys
          from pathlib import Path
          from verbalis import updates
          check, running = Path(sys.argv[1]), Path("dist/Verbalis.app")
          updates.check_same_signer(check / "ok" / "Verbalis.app", running)
          try:
              updates.check_same_signer(check / "foreign" / "Verbalis.app", running)
          except RuntimeError as e:
              print("re-signed copy refused as expected:", e)
          else:
              raise SystemExit("a re-signed copy was accepted")
          print("update signature check ok")
          PY
          rm -rf "$check"

      # For the first install: a disk image with Verbalis and a link to «Programme». The ZIP stays for
      # the automatic updates. Users without administrator rights just open Verbalis from the image –
      # it then offers to move itself into their personal «Programme» folder.
      - name: Disk image for the first install
        run: |
          set -euo pipefail
          staging="$RUNNER_TEMP/dmg"
          mkdir -p "$staging"
          ditto dist/Verbalis.app "$staging/Verbalis.app"
          ln -s /Applications "$staging/Programme"
          hdiutil create -volname "Verbalis" -srcfolder "$staging" -ov -format UDZO \
            "dist/Verbalis-${{ needs.version.outputs.version }}-macos-arm64.dmg"
          ls -lh dist/*.dmg

      - name: Sign and notarize the disk image
        if: steps.notarize.outputs.notarized == 'true'
        env:
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          set -euo pipefail
          dmg="dist/Verbalis-${{ needs.version.outputs.version }}-macos-arm64.dmg"
          codesign --force --timestamp --keychain "$SIGN_KEYCHAIN" --sign "$SIGN_IDENTITY" "$dmg"
          bash tools/macos/notarize.sh "$dmg"

      - name: Remove signing keys
        if: always()
        run: |
          rm -f "$RUNNER_TEMP/AuthKey.p8"
          if [ -n "${SIGN_KEYCHAIN:-}" ]; then security delete-keychain "$SIGN_KEYCHAIN" || true; fi

      - uses: actions/upload-artifact@v6
        with:
          name: Verbalis-${{ needs.version.outputs.version }}-macos
          path: |
            dist/Verbalis-*-macos-arm64.zip
            dist/Verbalis-*-macos-arm64.dmg
          if-no-files-found: error

  publish:
    needs: [version, windows, macos]
    # publish whenever Windows succeeded – with or without the Mac build (a failed Mac build is fixed in the next version)
    if: always() && needs.version.outputs.release == 'true' && needs.windows.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.version.outputs.sha }}

      - uses: actions/download-artifact@v4
        with:
          pattern: Verbalis-*
          path: dist
          merge-multiple: true

      - name: Release notes from CHANGELOG
        env:
          VERSION: ${{ needs.version.outputs.version }}
          MAC_RESULT: ${{ needs.macos.result }}
          MAC_NOTARIZED: ${{ needs.macos.outputs.notarized }}
        run: |
          python3 - <<'PY'
          import os, re
          version = os.environ["VERSION"]
          lines = open("CHANGELOG.md", encoding="utf-8").read().splitlines()
          start = next((i for i, l in enumerate(lines) if re.match(rf"^## {re.escape(version)} ", l)), None)
          if start is None:
              raise SystemExit(f"CHANGELOG.md has no section for {version}")
          notes = []
          for line in lines[start + 1:]:
              if line.startswith("## "):
                  break
              notes.append(line)
          notes += ["", f"**Windows:** download and run `Verbalis-{version}-setup.exe`. An update is installed the "
                        "same way – settings, correction list, models and recordings are kept."]
          if os.environ["MAC_RESULT"] == "success":
              first_start = ("Verbalis is notarized by Apple: on the first start just confirm «Öffnen». "
                             if os.environ.get("MAC_NOTARIZED") == "true" else
                             "On the first start macOS blocks the app because it is not notarized yet: close the message, then "
                             "System Settings → Privacy & Security → «Open Anyway» (once; updates keep it). ")
              notes += ["", f"**Mac (Apple Silicon):** open `Verbalis-{version}-macos-arm64.dmg` and drag "
                            "Verbalis onto «Programme» (Applications) – or just open Verbalis: it offers to move itself "
                            "there (into the personal Applications folder without an administrator account). "
                            "The ZIP is for the automatic updates. "
                            + first_start + "From macOS 14.2 Verbalis records the "
                            "others' audio itself (allow the «Audio Recording» permission); "
                            "only older Macs need BlackHole, see the README."]
          open("release-notes.md", "w", encoding="utf-8").write("\n".join(notes) + "\n")
          PY
          ls -l dist

      # frehner.tech links to releases/latest/download/<fixed name>: always the newest version, even when
      # the GitHub API (60 calls per hour and IP) doesn't answer. These names must not end like the update
      # files (updates.ASSET_SUFFIX), or the app's updater could pick them.
      - name: Copies under fixed names for download links
        run: |
          set -euo pipefail
          cp dist/Verbalis-*-setup.exe dist/Verbalis-Windows.exe
          if ls dist/Verbalis-*-macos-arm64.dmg >/dev/null 2>&1; then
            cp dist/Verbalis-*-macos-arm64.dmg dist/Verbalis-Mac.dmg
          fi
          ls -l dist

      - name: Create the version tag on the tested commit
        env:
          VERSION: ${{ needs.version.outputs.version }}
          SHA: ${{ needs.version.outputs.sha }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "v$VERSION" "$SHA" -m "Version $VERSION"
          git push origin "v$VERSION"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ needs.version.outputs.version }}
          name: Verbalis ${{ needs.version.outputs.version }}
          body_path: release-notes.md
          files: dist/*
          fail_on_unmatched_files: true
