name: 1 · Tests
# Title in the run list: what was tested (commit or pull request)
run-name: >-
  Tests: ${{ github.event_name == 'pull_request' && format('PR #{0} {1}', github.event.number, github.event.pull_request.title)
  || github.event.head_commit.message }}

on:
  push:
    branches: [main]     # not for tags – the release workflow tags after the tests anyway
  pull_request:

jobs:
  tests:
    # newest compatible versions – early warning for upcoming breakage
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.13", "3.14"]
        include:
          - os: macos-latest      # Mac version
            python: "3.12"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Compile the macOS system audio helper (Swift)
        if: runner.os == 'macOS'
        run: |
          mkdir -p tools/macos/build
          swiftc -O -swift-version 5 -target arm64-apple-macos14.2 \
            -o tools/macos/build/verbalis-audiotap tools/macos/audiotap.swift
          tools/macos/build/verbalis-audiotap --version
      - run: pip install -e ".[dev]" pyflakes
      - run: pyflakes src tests tools
      - run: pytest -q
      - name: Test catalogue up to date (docs/TESTING.md)
        run: python tools/test_catalog.py --check

  build-versions:
    # exactly the versions of the installer build (packaging/requirements-build.txt):
    # catches Dependabot pins that don't fit together before they break a release
    name: build versions
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      # an environment of its own: `pip check` looked at the runner's preinstalled tools too – pipx 1.18.4
      # wanted a newer filelock than ours and failed 0.7.33, although nothing of Verbalis was wrong
      - name: Own environment
        run: |
          python -m venv .venv-build
          "$PWD\.venv-build\Scripts" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Install the exact build versions
        run: |
          python -m pip install --upgrade pip
          pip install -c packaging/requirements-build.txt -e ".[build]" pytest
          if ($LASTEXITCODE -ne 0) { throw "The pinned versions in packaging/requirements-build.txt don't fit together" }
          pip check
          if ($LASTEXITCODE -ne 0) { throw "pip check found incompatible versions" }
      - run: pytest -q
