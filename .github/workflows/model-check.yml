name: 4 · Monthly check – our model copies and new Swiss German models

# Our Flix copy (malaxy/flix-swissgerman-ct2) is converted from Flix-AI/flix-swissgerman-full; our gcoli
# copy (malaxy/whisper-large-v3-turbo-swiss-german-ct2) mirrors gcoli's ct2/ folder unchanged.
# Installations only get a new version when we upload a new copy. This workflow checks
# monthly whether the original has a newer revision than the one we converted
# (UPSTREAM_REVISIONS in src/verbalis/transcription/models.py) and opens an issue if so.
# Models downloaded directly from their publishers (large-v3, large-v3-turbo) need no check:
# Verbalis notices and downloads their updates itself.
# A second step looks for new Swiss German speech recognition models (tools/find_new_models.py).

on:
  schedule:
    - cron: "0 6 3 * *"   # 3rd of every month, 06:00 UTC
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Compare converted models with their originals
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          report=$(python3 tools/check_upstream_models.py)
          status=$?
          echo "$report"
          if [ $status -eq 0 ]; then exit 0; fi
          if [ $status -ne 1 ]; then echo "Check failed"; exit $status; fi
          title="Newer version of a converted model available"
          open=$(gh issue list --state open --search "\"$title\" in:title" --json number --jq 'length')
          if [ "$open" != "0" ]; then
            echo "An issue is already open."
            exit 0
          fi
          gh issue create --title "$title" --body "$report

          Installations keep using our current copy until we upload a new one. To update:
          0. gcoli: compare the new revision with \`verbalis compare\`; if at least as good, run
             \`python tools/mirror_model.py gcoli --revision <new>\`, then continue with step 4.
          1. Flix: \`pip install -e \".[convert]\"\`, then \`verbalis convert-model Flix-AI/flix-swissgerman-full --force\`
          2. Compare old and new with \`verbalis compare\` (read-aloud text and a real Teams recording).
             Only continue if the new version is at least as good.
          3. Upload as described in \`tools/flix-model/README.md\`.
          4. Set the new revision in \`UPSTREAM_REVISIONS\` (\`src/verbalis/transcription/models.py\`),
             note it in the model card and in \`CHANGELOG.md\`, release.

          Every installation then downloads the new model the next time it transcribes, with progress,
          and shows a notice that the model was updated."

      - name: Look for new Swiss German models
        if: ${{ !cancelled() }}   # also when the first check failed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          report=$(python3 tools/find_new_models.py)
          status=$?
          echo "$report"
          if [ $status -eq 0 ]; then exit 0; fi
          if [ $status -ne 1 ]; then echo "Search failed"; exit $status; fi
          title="New Swiss German speech recognition models"
          open=$(gh issue list --state open --search "\"$title\" in:title" --json number --jq 'length')
          if [ "$open" != "0" ]; then
            echo "An issue is already open."
            exit 0
          fi
          gh issue create --title "$title" --body "$report

          Not in \`tools/known-models.txt\` yet. For each one:
          1. Licence: Verbalis is used at tocco – non-commercial licences (cc-by-nc …) are out.
          2. Promising (large model, many downloads, known training data)? Convert it if needed and measure it
             against the default model with \`verbalis compare\` (read-aloud text and a real Teams recording).
          3. Add it to \`tools/known-models.txt\` (with a short note), so it is not reported again."
