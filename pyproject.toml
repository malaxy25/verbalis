[project]
name = "verbalis"
version = "0.7.1"
description = "Record and transcribe conversations locally (microphone + system audio), Standard and Swiss German"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "soundcard>=0.4.6",
    "soundfile>=0.12",
    "faster-whisper>=1.1",
    "scipy>=1.11",
    "soxr>=0.3",
    "pywebview>=5",
]

[project.optional-dependencies]
dev = ["pytest>=8"]
# Only needed to convert Hugging Face models (e.g. Swiss German fine-tunes)
convert = ["transformers>=4.40", "torch", "accelerate", "huggingface_hub"]

[project.scripts]
verbalis = "verbalis.cli:main"

[project.gui-scripts]
# Starts the UI without a console window – target of the desktop shortcut
verbalis-app = "verbalis.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/verbalis"]

[tool.pytest.ini_options]
testpaths = ["tests"]
